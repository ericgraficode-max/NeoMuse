<div id="ar-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;background:#000;"><button id="close-ar" style="position:absolute;top:25px;right:25px;z-index:1000000;background:rgba(0,0,0,0.6);color:white;border:2px solid white;border-radius:50%;width:50px;height:50px;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;">&times;</button><div id="ar-spinner"></div><div id="ar-instructions" style="position:absolute;bottom:50px;width:100%;text-align:center;color:white;z-index:1000000;text-shadow:0 2px 4px rgba(0,0,0,0.8);font-size:18px;pointer-events:none;font-family:sans-serif;">TAP SCREEN TO START<br>Then point at poster</div><div id="ar-container" style="width:100%;height:100%;"></div></div>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>(function(){const ASSET_BASE_URL="https://neo-muse.com/wp-content/ar-assets/";const urlParams=new URLSearchParams(window.location.search);const arId=urlParams.get('ar_id');if(arId){if(document.readyState==='complete'){startAR(arId);}else{window.addEventListener('load',()=>startAR(arId));}}function startAR(id){const overlay=document.getElementById('ar-overlay');const container=document.getElementById('ar-container');overlay.style.display='block';document.body.style.overflow='hidden';const mindFile=ASSET_BASE_URL+id+".mind";const videoFile=ASSET_BASE_URL+id+".mp4";container.innerHTML='<a-scene embedded loading-screen="enabled:false" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" renderer="alpha:true;colorManagement:true;" mindar-image="imageTargetSrc:'+mindFile+';autoStart:true;uiScanning:#ar-instructions"><a-assets><video id="ar-video" src="'+videoFile+'" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="ar-target" mindar-image-target="targetIndex:0"><a-video src="#ar-video" width="1.3" height="1.95" position="0 0.15 0"></a-video></a-entity></a-scene>';const sceneEl=container.querySelector('a-scene');sceneEl.addEventListener("renderstart",()=>{overlay.style.background="transparent";document.getElementById('ar-spinner').style.display='none';const targetEl=document.querySelector('#ar-target');const instructions=document.getElementById('ar-instructions');targetEl.addEventListener("targetFound",()=>{const videoEl=document.querySelector('#ar-video');if(videoEl)videoEl.play();instructions.style.display='none';});targetEl.addEventListener("targetLost",()=>{const videoEl=document.querySelector('#ar-video');if(videoEl)videoEl.pause();instructions.style.display='block';});});}document.getElementById('close-ar').addEventListener('click',()=>{const cleanUrl=window.location.origin+window.location.pathname;window.location.href=cleanUrl;});})();</script>
<style>.a-enter-vr{display:none!important;}#ar-container canvas{left:0!important;top:0!important;}.mindar-ui-overlay{display:none!important;}#ar-spinner{border:4px solid rgba(255,255,255,0.3);border-top:4px solid #fff;border-radius:50%;width:40px;height:40px;animation:ar-spin 1s linear infinite;position:absolute;top:50%;left:50%;z-index:1000001;transform:translate(-50%,-50%);}@keyframes ar-spin{0%{transform:translate(-50%,-50%) rotate(0deg);}100%{transform:translate(-50%,-50%) rotate(360deg);}}</style>
